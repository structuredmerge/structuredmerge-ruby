---
family:
  name: structuredmerge-ruby
  mode: monorepo
  local_path_env: STRUCTUREDMERGE_DEV
  members_root: gems

members:
  roots:
    - gems/tree_haver
    - gems/ast-merge
    - gems/ast-crispr
    - gems/ast-crispr-ruby-prism
    - gems/ast-crispr-markdown-markly
    - gems/ast-merge-git
    - gems/plain-merge
    - gems/bash-merge
    - gems/dotenv-merge
    - gems/rbs-merge
    - gems/html-merge
    - gems/json-merge
    - gems/yaml-merge
    - gems/toml-merge
    - gems/markdown-merge
    - gems/ruby-merge
    - gems/go-merge
    - gems/rust-merge
    - gems/typescript-merge
    - gems/ast-template
    - gems/binary-merge
    - gems/zip-merge
    - gems/psych-merge
    - gems/citrus-toml-merge
    - gems/parslet-toml-merge
    - gems/commonmarker-merge
    - gems/kramdown-merge
    - gems/markly-merge
    - gems/prism-merge
    - gems/kettle-jem
    - gems/smorg-rb
  exclude:
    - "**/benchmarks/**"
  order:
    mode: dependency
    hints:
      - tree_haver
      - ast-merge
      - ast-crispr
      - ast-crispr-ruby-prism
      - ast-crispr-markdown-markly
      - ast-merge-git
      - plain-merge
      - bash-merge
      - dotenv-merge
      - rbs-merge
      - html-merge
      - json-merge
      - yaml-merge
      - toml-merge
      - markdown-merge
      - ruby-merge
      - go-merge
      - rust-merge
      - typescript-merge
      - ast-template
      - binary-merge
      - zip-merge
      - psych-merge
      - citrus-toml-merge
      - parslet-toml-merge
      - commonmarker-merge
      - kramdown-merge
      - markly-merge
      - prism-merge
      - kettle-jem
      - smorg-rb

commands:
  lint: bundle exec rubocop-gradual --autocorrect --force-update
  docs: bin/rake yard

check:
  required_files:
    - Gemfile
    - Gemfile.lock
    - Rakefile
    - README.md
    - LICENSE.md
    - .rspec
    - .simplecov
    - .yardignore
    - .yardopts
    - bin/setup
    - spec/spec_helper.rb
    - gemfiles/modular/documentation.gemfile
    - gemfiles/modular/x_std_libs.gemfile
  required_bins:
    - bin/gem_checksums
    - bin/kettle-changelog
    - bin/kettle-pre-release
    - bin/kettle-release
    - bin/kettle-test
    - bin/rake
    - bin/rspec
    - bin/yard
  root_required_files:
    - CHANGELOG.md
    - CODE_OF_CONDUCT.md
    - CONTRIBUTING.md
    - FUNDING.md
    - LICENSE.md
    - SECURITY.md
    - .structuredmerge/git-drivers.toml
  member_required_dirs:
    - docs
  forbidden_tracked_member_dirs:
    - .devcontainer
    - .git-hooks
    - .github
    - .idea
    - .qlty
  forbidden_tracked_member_dirs_except:
    - kettle-jem
  readme_links:
    CHANGELOG.md: CHANGELOG.md
    CODE_OF_CONDUCT.md: CODE_OF_CONDUCT.md
    CONTRIBUTING.md: CONTRIBUTING.md
    SECURITY.md: SECURITY.md

changelog:
  mode: root
  path: CHANGELOG.md
  version_file: gems/tree_haver/lib/tree_haver/version.rb

template:
  normalize_lockfiles: true
  normalize_lockfiles_command: bundle update --bundler

install:
  local_dependencies:
    - ../../kettle-dev/nomono
    - ../../kettle-dev/token-resolver
    - ../../kettle-dev/kettle-dev
    - ../../kettle-dev/kettle-drift
    - ../../kettle-dev/kettle-soup-cover
    - ../../kettle-dev/kettle-test
    - ../../appraisal-rb/kettle-jem-appraisals

release:
  # The release task supplies the local workspace path. kettle-family turns it
  # off for each member once its selected sibling dependencies are released.
  local_path_strategy: waves
  build_command: bundle exec rake build
  publish_command: bundle exec kettle-release skip_steps=1
  waves:
    - [tree_haver]
    - [ast-merge, binary-merge]
    - [ast-crispr, ast-template, bash-merge, go-merge, json-merge, markdown-merge, plain-merge, rbs-merge, ruby-merge, rust-merge, toml-merge, typescript-merge, yaml-merge, zip-merge]
    - [citrus-toml-merge, commonmarker-merge, dotenv-merge, html-merge, kramdown-merge, markly-merge, parslet-toml-merge, prism-merge, psych-merge]
    - [ast-crispr-markdown-markly, ast-crispr-ruby-prism]
    - [ast-merge-git]
    - [kettle-jem]
    - [smorg-rb]
  disable_local_path_env:
    - K_JEM_TEMPLATING
    - TSLP_DEV
  env:
    GALTZO_FLOSS_DEV: false
    KETTLE_DEV_DEV: false
    STRUCTUREDMERGE_DEV: false
    TSLP_DEV: ""
  family_changelog:
    enabled: true
    command: kettle-changelog

pre_release:
  image_url_skip_patterns:
    - https://img.shields.io/*
    - https://contrib.rocks/image?repo=*
