---
family:
  name: structuredmerge-ruby
  members_root: gems

members:
  order:
    mode: dependency
    hints:
      - tree_haver
      - ast-merge
      - ast-crispr
      - ast-crispr-ruby-prism
      - ast-crispr-markdown-markly
      - ast-merge-git
      - plain-merge
      - bash-merge
      - dotenv-merge
      - rbs-merge
      - json-merge
      - yaml-merge
      - toml-merge
      - markdown-merge
      - ruby-merge
      - go-merge
      - rust-merge
      - typescript-merge
      - ast-template
      - binary-merge
      - zip-merge
      - psych-merge
      - citrus-toml-merge
      - parslet-toml-merge
      - commonmarker-merge
      - kramdown-merge
      - markly-merge
      - prism-merge
      - smorg-rb
      - kettle-jem

commands:
  lint: bundle exec rake rubocop_gradual:autocorrect rubocop_gradual:force_update
  docs: bin/rake yard

check:
  required_files:
    - Gemfile
    - Gemfile.lock
    - Rakefile
    - README.md
    - LICENSE.md
    - .rspec
    - .simplecov
    - .yardignore
    - .yardopts
    - bin/setup
    - spec/spec_helper.rb
    - gemfiles/modular/documentation.gemfile
    - gemfiles/modular/x_std_libs.gemfile
  required_bins:
    - bin/gem_checksums
    - bin/kettle-changelog
    - bin/kettle-pre-release
    - bin/kettle-release
    - bin/kettle-test
    - bin/rake
    - bin/rspec
    - bin/yard
  root_required_files:
    - CHANGELOG.md
    - CODE_OF_CONDUCT.md
    - CONTRIBUTING.md
    - FUNDING.md
    - LICENSE.md
    - SECURITY.md
    - .structuredmerge/git-drivers.toml
  member_required_dirs:
    - docs
  forbidden_tracked_member_dirs:
    - .devcontainer
    - .git-hooks
    - .github
    - .idea
    - .qlty
  forbidden_tracked_member_dirs_except:
    - kettle-jem
  readme_links:
    CHANGELOG.md: CHANGELOG.md
    CODE_OF_CONDUCT.md: CODE_OF_CONDUCT.md
    CONTRIBUTING.md: CONTRIBUTING.md
    SECURITY.md: SECURITY.md

changelog:
  mode: root
  path: CHANGELOG.md
  version_file: gems/tree_haver/lib/tree_haver/version.rb

template:
  normalize_lockfiles: true
  normalize_lockfiles_command: bundle update --bundler

install:
  local_dependencies:
    - ../../kettle-dev/nomono
    - ../../kettle-dev/token-resolver
    - ../../kettle-dev/kettle-dev
    - ../../kettle-dev/kettle-drift
    - ../../kettle-dev/kettle-soup-cover
    - ../../kettle-dev/kettle-test
    - ../../appraisal-rb/kettle-jem-appraisals

release:
  build_command: bundle exec rake build
  publish_command: bundle exec kettle-release
  env:
    GALTZO_FLOSS_DEV: false
    KETTLE_RB_DEV: false
    SMORG_RB_DEV: false
    TSLP_DEV: ""
  family_changelog:
    enabled: true
    command: bundle exec kettle-changelog
