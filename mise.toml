[tools]
ruby = "4.0.6"

[env]
KJ_HOMEPAGE_URI = "https://structuredmerge.org"
KJ_REPOSITORY_TOPOLOGY = "monorepo-subproject"
KETTLE_JEM_TEMPLATE_PROFILE = "monorepo-subgem"

[tasks.test]
description = "Run Ruby specs"
run = "bundle exec rspec"

[tasks.check]
description = "Run the local Ruby verification suite"
run = "bundle exec rspec"
