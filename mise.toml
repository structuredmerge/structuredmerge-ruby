[tools]
ruby = "4.0.6"

[env]
KJ_RUBYFORUM_FAMILY_TAG = "structuredmerge"
FORGE_ORG = "structuredmerge"
KJ_HOMEPAGE_URI = "https://structuredmerge.org"
KJ_REPOSITORY_TOPOLOGY = "monorepo-subproject"
KETTLE_JEM_TEMPLATE_PROFILE = "monorepo-subgem"
# Releases run from member gem directories but update this shared changelog.
K_CHANGELOG_PATH = "{{config_root}}/CHANGELOG.md"

[tasks.test]
description = "Run each member gem suite with its own bundle"
run = "bundle exec kettle-family test --execute"

[tasks.lint]
description = "Run read-only lint checks across family members"
run = "bundle exec kettle-family lint --execute"

[tasks.lint-fix]
description = "Autocorrect lint issues across family members without committing"
run = "bundle exec kettle-family bex --execute --no-commit -- bin/rake rubocop_gradual:autocorrect"

[tasks.readiness]
description = "Run family readiness checks without changing files"
run = "bundle exec kettle-family check --execute"

[tasks.check]
description = "Run readiness, lint, and tests across the family"
depends = ["readiness", "lint", "test"]
run = "true"

[tasks.state]
description = "Report release state for every family member"
run = "bundle exec kettle-family state"

[tasks.install]
description = "Build and install selected family gems locally"
run = "bundle exec kettle-family install --execute"

[tasks.template]
description = "Apply kettle-jem templates across family members"
run = "bundle exec kettle-family template --execute"

[tasks.docs]
description = "Generate documentation across family members"
run = "bundle exec kettle-family docs --execute"

[tasks.deps]
description = "Update dependencies from released sources without committing"
run = "bundle exec kettle-family bup --execute --no-commit"

[tasks.deps-local]
description = "Update dependencies against local family and Kettle sources"
run = "STRUCTUREDMERGE_DEV={{config_root}}/gems KETTLE_DEV_DEV={{config_root}}/../../kettle-dev K_JEM_TEMPLATING=true bundle exec kettle-family bup --execute --no-commit"

[tasks.deps-release]
description = "Update dependencies from released sources and commit lockfiles"
run = "STRUCTUREDMERGE_DEV=false KETTLE_DEV_DEV=false K_JEM_TEMPLATING=false bundle exec kettle-family bup --execute --commit"

[tasks.bup]
description = "Update dependencies from released sources; pass gems or options after --"
raw = true
run = "STRUCTUREDMERGE_DEV=false KETTLE_DEV_DEV=false K_JEM_TEMPLATING=false bundle exec kettle-family bup --execute --no-commit"

[tasks.bup-release]
description = "Update dependencies from released sources and commit lockfiles"
run = "STRUCTUREDMERGE_DEV=false KETTLE_DEV_DEV=false K_JEM_TEMPLATING=false bundle exec kettle-family bup --execute --commit"

[tasks.bump]
description = "Bump family versions; pass VERSION or major/minor/patch/pre"
raw = true
run = "bundle exec kettle-family bump --execute"

[tasks.changelog]
description = "Add a structured entry to a member Unreleased changelog"
raw = true
run = "bundle exec kettle-family add-changelog --execute"

[tasks.clean]
description = "Remove locally installed family versions newer than released"
run = "bundle exec kettle-family clean-unreleased --execute"

[tasks.pins]
description = "Review and update GitHub Actions pins across the family"
run = "bundle exec kettle-family gha-sha-pins --execute"

[tasks.release]
description = "Publish dependency waves with the local templating graph available to aggregate coverage"
raw = true
run = "K_JEM_TEMPLATING=true STRUCTUREDMERGE_DEV={{config_root}}/gems KETTLE_DEV_DEV=false bundle exec kettle-family release --execute --publish --secrets-provider op --skip-steps 1 --env K_JEM_TEMPLATING=true --env STRUCTUREDMERGE_DEV={{config_root}}/gems"

[tasks.bupb]
description = "Update Bundler across family members; pass options after --"
raw = true
run = "STRUCTUREDMERGE_DEV=false KETTLE_DEV_DEV=false K_JEM_TEMPLATING=false bundle exec kettle-family bupb --execute"

[tasks.bex]
description = "Run a bundle exec command across family members; pass COMMAND after --"
raw = true
run = "bundle exec kettle-family bex --execute"

[tasks.branch-lanes]
description = "Audit configured branch lanes"
raw = true
run = "bundle exec kettle-family branch-lanes"

[tasks.discover]
description = "Discover family members and execution order"
raw = true
run = "bundle exec kettle-family discover"

[tasks.metadata]
description = "Report member version and project metadata"
raw = true
run = "bundle exec kettle-family metadata"

[tasks.report]
description = "Report family discovery and configuration"
raw = true
run = "bundle exec kettle-family report"

[tasks.pull]
description = "Pull selected family repositories; pass options after --"
raw = true
run = "bundle exec kettle-family pull --execute"

[tasks.push]
description = "Push selected family repositories; pass options after --"
raw = true
run = "bundle exec kettle-family push --execute"

[tasks.up]
description = "Pull then push selected family repositories; pass options after --"
raw = true
run = "bundle exec kettle-family up --execute"

[tasks.sync]
description = "Sync selected family branches; pass options after --"
raw = true
run = "bundle exec kettle-family sync --execute"

[tasks.reset]
description = "Reset a managed family artifact; pass TARGET after --"
raw = true
run = "bundle exec kettle-family reset --execute"

[tasks.mise-trust]
description = "Trust mise configuration for the family and members"
raw = true
run = "bundle exec kettle-family mise-trust"

[tasks.reconcile-releases]
description = "Create verified missing GitHub Releases; pass options after --"
raw = true
run = "bundle exec kettle-family reconcile-releases --execute"

[tasks.release-state]
description = "Report changelog release state for every family member"
raw = true
run = "bundle exec kettle-family release-state"
