[tools]
ruby = "4.0.6"

[env]
KJ_RUBYFORUM_FAMILY_TAG = "structuredmerge"
FORGE_ORG = "structuredmerge"
KJ_HOMEPAGE_URI = "https://structuredmerge.org"
KJ_REPOSITORY_TOPOLOGY = "monorepo-subproject"
KETTLE_JEM_TEMPLATE_PROFILE = "monorepo-subgem"
# Releases run from member gem directories but update this shared changelog.
K_CHANGELOG_PATH = "{{config_root}}/CHANGELOG.md"

[tasks.test]
description = "Run each member gem suite with its own bundle"
run = "bundle exec kettle-family test --execute"

[tasks.lint]
description = "Run lint across family members"
run = "bundle exec kettle-family lint --execute"

[tasks.bup]
description = "Refresh member bundles against local family dependencies without committing path locks"
run = "STRUCTUREDMERGE_DEV={{config_root}}/gems KETTLE_DEV_DEV={{config_root}}/../../kettle-dev K_JEM_TEMPLATING=true bundle exec kettle-family bup --execute --no-commit"

[tasks.bup-release]
description = "Refresh member bundles against released dependencies and commit lockfile updates"
run = "STRUCTUREDMERGE_DEV=false KETTLE_DEV_DEV=false K_JEM_TEMPLATING=false bundle exec kettle-family bup --execute"

[tasks.release]
description = "Publish dependency waves with local paths available to the aggregate changelog suite"
raw = true
run = "STRUCTUREDMERGE_DEV={{config_root}}/gems KETTLE_DEV_DEV={{config_root}}/../../kettle-dev bundle exec kettle-family release --execute --publish --secrets-provider op --env STRUCTUREDMERGE_DEV={{config_root}}/gems"
