inherit_gem:
  rubocop-lts: config/rubygem_rspec.yml

inherit_from:
  - .rubocop_rspec.yml

plugins:
  - rubocop-on-rbs
  - rubocop-packaging
  - rubocop-rspec

# This tells RuboCop to add the exclusions in this file
# to the default exclusions (and those from other inherited files),
# rather than overwriting them.
inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - certs/**/*
    - checksums/**/*
    - docs/**/*
    - examples/**/*
    - fixtures/**/*
    - gemfiles/*.gemfile
    - pkg/**/*
    - results/**/*
    - spec/fixtures/**/*
    - spec/tmp/**/*
    - tmp/**/*
    - vendor/**/*
    - AGENTS.md
    - benchmarks/fixtures/**/*

RBS:
  Enabled: true

Layout/IndentationConsistency:
  Exclude: ['*.md']

# The template supports a Ruby 4-only release while linting generated fixtures
# against the inherited Ruby 3.2 parser target.
Gemspec/RequiredRubyVersion:
  Exclude:
    - kettle-jem.gemspec
