RSpec/MultipleExpectations:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

RSpec/InstanceVariable:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/ExpectInHook:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - 'spec/require_boundary_spec.rb'
    - 'spec/examples/*'
    - 'spec/integration/*'
    - 'spec/system/*'
    - 'spec/e2e/*'

RSpec/SpecFilePathFormat:
  Exclude:
    - 'spec/byte_offset_edit_spec.rb'
    - 'spec/cli_spec.rb'
    - 'spec/old_public_spec_audit_spec.rb'
    - 'spec/rake_tasks_spec.rb'
    - 'spec/release_packaging_spec.rb'
    - 'spec/self_test_task_spec.rb'
    - 'spec/template_version_gem_bootstrap_spec.rb'
    - 'spec/thin_slice_spec.rb'
    - 'spec/version_gem_pattern_spec.rb'

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/SpecFilePathSuffix:
  Exclude:
    - 'spec/README.md'

RSpec/NoExpectationExample:
  Exclude:
    - 'spec/README.md'

RSpec/MultipleDescribes:
  Exclude:
    - 'spec/README.md'

RSpec/RepeatedExampleGroupDescription:
  Exclude:
    - 'spec/README.md'

RSpec/Output:
  Exclude:
    - 'spec/support/**/*'
    - 'spec/config/**/*'
    - 'spec/fixtures/**/*'
