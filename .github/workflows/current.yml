name: Current

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
      - '*-stable'
    tags:
      - '!*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Clone sibling fixtures repo
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/structuredmerge/structuredmerge-fixtures ../fixtures
      - name: Setup Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: 4.0.2
          bundler-cache: true
          cache-version: current-20260605
      - name: Run checks
        run: timeout 12m bundle exec rspec --format progress
